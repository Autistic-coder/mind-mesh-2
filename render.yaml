services:
  - type: web
    name: mindmesh2-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start.sh
    healthCheckPath: /api/ready
    buildFilter:
      paths:
        - backend/**
        - model/**
        - render.yaml
        - .python-version
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: MODEL_PATH
        value: /opt/render/project/src/model/mindmesh_rf_v1.joblib
      - key: MODEL_MANIFEST_PATH
        value: /opt/render/project/src/model/model_manifest.json
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WEB_CONCURRENCY
        value: "1"
